<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيرلو | صالون الحلاقة العصري</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
      scroll-behavior: smooth;
    }
    nav {
      background-color: rgba(30, 30, 30, 0.9);
      padding: 10px 0;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo {
      font-size: 2.2em;
      color: #f39c12;
      font-weight: bold;
    }
    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('ba.jpg');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      opacity: 0.4;
      z-index: -1;
      animation: zoomIn 20s infinite alternate ease-in-out;
    }
    @keyframes zoomIn {
      0% {
        transform: scale(1);
      }
      100% {
        transform: scale(1.05);
      }
    }
    @media (max-width: 768px) {
      .hero::before {
        background-attachment: scroll;
        background-size: cover;
      }
    }
    .hero-text h2 {
      font-size: 2.5em;
      color: #f1c40f;
      margin: 0;
    }
    .hero-text p {
      font-size: 1.2em;
      color: #ddd;
    }
    .team, .map {
      padding: 30px 20px;
      text-align: center;
    }
    .barbers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .barber {
      background-color: rgba(30, 30, 30, 0.9);
      padding: 15px;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }
    .barber:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 10px #f39c12;
    }
    .barber img {
      width: 100%;
      border-radius: 10px;
    }
    .barber h3 {
      margin: 10px 0 5px;
      color: #f39c12;
    }
    .whatsapp-btn {
      display: inline-block;
      margin-top: 10px;
      background-color: #25D366;
      color: white;
      padding: 8px 12px;
      border-radius: 5px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    .whatsapp-btn:hover {
      background-color: #1ebe57;
    }
    .map iframe {
      margin-top: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <h1 class="logo">P I R L O</h1>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h2>مرحباً بكم في صالون بيرلو</h2>
      <p>أناقتك تبدأ من هنا – خبراء الحلاقة والعناية الرجالية</p>
    </div>
  </section>

  <section class="team">
    <h2>طاقم الحلاقين</h2>
    <div class="barbers">
      <div class="barber">
        <img src="mo.jpg" alt="الحلاق مؤمل ">
        <h3>مؤمل</h3>
        <p></p>
        <a href="https://wa.me/9647730600181" class="whatsapp-btn" target="_blank">احجز مع مؤمل</a>
      </div>
      <div class="barber">
        <img src="ah.jpg" alt="الحلاق احمد">
        <h3>احمد</h3>
        <p></p>
        <a href="https://wa.me/9647713151385" class="whatsapp-btn" target="_blank">احجز مع احمد</a>
      </div>
      <div class="barber">
        <img src="hu.jpg" alt="الحلاق حسين">
        <h3>حسين</h3>
        <p></p>
        <a href="https://wa.me/9647708745489" class="whatsapp-btn" target="_blank">احجز مع حسين</a>
      </div>
      
    </div>
  </section>

  <section class="map">
    <h2>موقعنا</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d464.6222229924695!2d47.70403302620261!3d30.394808791893713!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3fc4bd002443557d%3A0x3be6f2649abe6755!2z2LnZhdin2LHYqSDYr9ix2YfZhQ!5e0!3m2!1sar!2siq!4v1746229693371!5m2!1sar!2siq" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const logo = document.querySelector(".logo");
      logo.addEventListener("click", () => {
        alert("مرحبا بك في بيرلو ✂️");
      });
    });
  </script>
</body>
</html>
